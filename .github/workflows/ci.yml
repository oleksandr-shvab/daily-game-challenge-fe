name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the trailing comment names the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type check and production build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The generated client is committed and must match the backend contract.
  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Regenerate from the backend's OpenAPI snapshot on main
        env:
          API_SPEC: https://raw.githubusercontent.com/oleksandr-shvab/my-list-be/main/openapi/openapi.json
        run: npm run api:generate
      - name: Generated code is up to date
        run: |
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            git status --porcelain -- src/api/generated
            echo "src/api/generated differs from the backend contract: run npm run api:generate and commit"
            exit 1
          fi

  # The production image is Caddy with the built app. The build runs `caddy validate` on
  # deploy/Caddyfile. Nothing is pushed.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t dgc-web:ci .
      - name: Image checks
        run: |
          # In its own line: bash -e ignores a failing $(...) inside a test argument.
          uid=$(docker run --rm --entrypoint id dgc-web:ci -u)
          test "$uid" = 10001
          id=$(docker create dgc-web:ci)
          docker cp "$id:/srv/index.html" index.html
          docker rm "$id"
          # A <script> tag without src is an inline script, which the CSP blocks.
          if grep -E '<script' index.html | grep -v 'src='; then
            echo "index.html has an inline script"
            exit 1
          fi
